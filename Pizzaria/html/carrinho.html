<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://www.flaticon.com/free-icon/pizza_6978255">

    <link rel="stylesheet" href="../css/carrinho.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <script>
        if (sessionStorage.getItem("isLog") != "true") {
            alert("Você precisa estar logado para acessar aqui!");
            window.location.replace("login.html");
        }
    </script>

    <title>Forno&Codigo - Carrinho</title>
</head>

<body>
    <header>

    </header>

    <div class="spacement">
        <!-- Espaçamento entre o 'header' e o 'main' -->
    </div>

    <main>

        <section class="sectionCarrinho">
            <table>

                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Preço</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="cont">
                    <!-- Aqui será renderizado o carrinho do arquivo "carrinho.js" -->
                </tbody>

                <tfoot id="valor-total">
                    <!-- Aqui será renderizado o valor final do arquivo "carrinho.js" -->
                </tfoot>

            </table>

        </section>

        <section class="actionButtons">
            <div class="btns">
                <button class="btn-cancel" onclick="decision(1)">Cancelar</button>
                <button class="btn-comprar" onclick="decision(2)">Comprar</button>
            </div>
        </section>

    </main>

    <footer id="footer">

    </footer>

</body>
<script src="../js/carrinho.js"></script>
<script src="../js/body/header.js"></script>
<script src="../js/body/footer.js"></script>


</html>
