<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://www.flaticon.com/free-icon/pizza_6978255">

    <link rel="stylesheet" href="../css/carrinho.css">
    <link rel="stylesheet" href="../css/header.css">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <title>Forno&Codigo - Carrinho</title>
</head>

<body>
    <header>
        <nav>
            <div class="logotipo">
                <p>Forno&Código</p>
            </div>

            <div class="acoes">
                <ul>
                    <li id="btn-carrinho"><a href="./menu.html">Cardápio</a></li>
                    <li><a href="../index.html">Home</a></li>
                </ul>
                <div class="acoes-login">
                    <a href="./login.html">Login</a>
                    <a href="./login.html">
                        <img src="../../src/Images/user-icon.png" width="149" alt="user-icon" />
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <div class="spacement">
        <!-- Espaçamento entre o 'header' e o 'main' -->
    </div>

    <main>

        <section class="sectionCarrinho">
            <table>

                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Preço</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="cont">
                    <!-- Aqui será renderizado o carrinho do arquivo "carrinho.js" -->
                </tbody>

                <tfoot id="valor-total">
                    <!-- Aqui será renderizado o valor final do arquivo "carrinho.js" -->
                </tfoot>

            </table>
        </section>

    </main>

</body>
<script src="../js/carrinho.js"></script>

</html>
