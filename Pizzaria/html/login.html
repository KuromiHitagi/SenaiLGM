<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">

    <script>
        if (sessionStorage.getItem("isLog") == "true") {
            window.location.href = "perfil.html"
        }
    </script>

    <title>Forno&Codigo - Login</title>
</head>

<body>
    <header>
        <!-- Aqui será renderizado o 'header.js' -->
    </header>

    <div class="spacement">
        <!-- Espaçamento entre o 'header' e o 'main' -->
    </div>

    <main>

        <section>
            <form class="form" onsubmit="logar(event)">

                <div class="title">
                    <h2>Login</h2>
                </div>

                <div class="labelInput">
                    <label for="email">Email:</label>

                    <div class="inputDiv">
                        <div class="tooltip">
                            <p>Escreva o seu E-mail aqui ou seu Nome no campo abaixo</p>
                        </div>

                        <input type="text" id="email">
                    </div>
                </div>

                <div class="gap">
                    <h2>ou</h2>
                </div>

                <div class="labelInput">
                    <label for="name">Nome:</label>

                    <div class="inputDiv">
                        <div class="tooltip">
                            <p>Escreva o seu Nome aqui ou seu E-mail no campo acima</p>
                        </div>

                        <input type="text" id="name">
                    </div>
                </div>

                <div class="labelInput password">
                    <label for="password">Senha:</label>

                    <div class="inputDiv">
                        <div class="tooltip">
                            <p>Escreva a sua senha</p>
                        </div>

                        <input type="password" id="password">
                        <button type="button" style="color: black; letter-spacing: normal; font-size: 14px;" id="btn-olho" onclick="alternarSenha()">Mostrar</button>
                    </div>
                </div>

                <button class="grow" type="submit">Logar</button>
            </form>

            <button class="btnCriarConta grow" onclick="{window.location.href = 'form.html'}">Criar conta</button>
        </section>

    </main>

    <footer id="footer">

    </footer>

</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cryptojs/4.1.1/crypto-js.min.js"></script>

<script src="../js/register/cliente.js"></script>
<script src="../js/login.js"></script>

<script src="../js/body/header.js"></script>
<script src="../js/body/footer.js"></script>

</html>
