<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <title>Forno&Codigo - menu</title>
</head>

<body>
    <header>
        <nav>
            <div class="logotipo">
                <p>Forno&Código</p>
            </div>

            <div class="acoes">
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="#start">Início</a></li>
                </ul>
                <div class="acoes-login">
                    <a href="./login.html">Login</a>
                    <a href="#">
                        <img src="../../src/Images/user-icon.png" width="149" alt="user-icon" />
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <div class="spacement" id="start">
        <!-- Espaçamento entre o 'header' e o 'main' -->
    </div>

    <main>

        <section class="cards-tipos">

            <article class="card">
                <a href="#swiper-wrapper">
                    <div class="img-div">
                        <img src="https://cdn-icons-png.flaticon.com/128/1404/1404945.png" alt="pizza-icon">
                    </div>

                    <div class="content-div">
                        <p>Pizzas</p>
                    </div>
                </a>
            </article>

            <article class="card">
                <a href="#">
                    <div class="combo-div">
                        <img src="https://cdn-icons-png.flaticon.com/128/735/735842.png" alt="soda-combo-icon">
                        <img src="https://cdn-icons-png.flaticon.com/128/6978/6978255.png" alt="pizza-combo-icon">
                    </div>

                    <div class="content-div">
                        <p>Combos</p>
                    </div>
                </a>
            </article>

            <article class="card">
                <a href="#">
                    <div class="img-div">
                        <img src="https://cdn-icons-png.flaticon.com/128/536/536658.png" alt="soda-icon">
                    </div>

                    <div class="content-div">
                        <p>Bebidas</p>
                    </div>
                </a>
            </article>

        </section>

        <section class="swiper-Pizzas">
            <div class="swiper">
                <div class="swiper-wrapper" id="swiper-wrapper">
                    <!-- Aqui serão renderizadas as pizzas do arquivo 'JSON', pela num carrossel feito pela biblioteca swiper -->
                </div>

                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>
            </div>
        </section>

    </main>

    <div id="modal">
        <!-- Esta div serve apenas para expandir os detalhes das pizzas do arquivo 'JSON' -->
    </div>

</body>
<script src="../js/JSON.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    const swiper = new Swiper('.swiper', {
        slidesPerView: 3,
        spaceBetween: 30,
        loop: true,
        navigation: {
            nextEl: '.swiper-button-next',
            prevEl: '.swiper-button-prev',
        },
        breakpoints: {
            320: { slidesPerView: 1 },
            768: { slidesPerView: 2 },
            1024: { slidesPerView: 3 }
        }
    });
</script>

</html>
