<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/perfil.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">

    <script>
        if (sessionStorage.getItem("isLog") != "true") {
            alert("Saindo!")
            window.location.href = "login.html"
        }
    </script>

    <title>Forno&Codigo - Perfil</title>
</head>

<body>
    <header>
        <!-- Aqui será renderizado o 'header.js' -->
    </header>

    <div class="spacement">
        <!-- Espaçamento entre o 'header' e o 'main' -->
    </div>

    <main>

        <section>

            <div class="divImage">
                 <img src="../images/imagem_Logado.jpg" alt="" 
                 style="border: 1px solid #ffbd59; border-radius: 50%;">

                <button onclick="alert('Isso daqui é meramente decorativo')" 
                 style="letter-spacing: 2px; background-color: #3b3737; font-size: 16px; color: #ffbd59; border: none; border-radius: 15px; padding: 10px; width: 140px;margin-top: 15px; cursor: pointer;">
                    Editar
                </button>
            </div>

        </section>

        <section>

            <div class="dados">

                <div class="labelInput">
                    <h2 class="h2">Nome: </h2>

                    <div class="inputDiv">
                        <h2 id="nome"></h2>
                    </div>
                </div>

                <div class="labelInput">
                    <h2 class="h2">Email: </h2>

                    <div class="inputDiv">
                        <h2 id="email"></h2>
                    </div>
                </div>

                <div class="labelInput">
                    <h2 class="h2">Endereço: </h2>

                    <div class="inputDiv">
                        <h2 id="endereco"></h2>
                    </div>
                </div>

                <div class="labelInput">
                    <h2 class="h2">Telefone: </h2>

                    <div class="inputDiv">
                        <h2 id="telefone"></h2>
                    </div>
                </div>

            </div>

            <button style="font-size: 16px;" onclick="alert('Função de edição não implementada ainda.')">Editar</button>
        </section>

        <button style="position: absolute; bottom: 20%; width: 160px; height: 40px; border: none; border-radius: 15px; color: #e4e4e4; font-size: 16px; background-color: #d8373f;" onclick="deslogar()">Logout</button>

    </main>

    <footer id="footer">

    </footer>

</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cryptojs/4.1.1/crypto-js.min.js"></script>

<script src="../js/register/cliente.js"></script>
<script src="../js/perfil.js"></script>

<script src="../js/body/header.js"></script>
<script src="../js/body/footer.js"></script>

</html>
