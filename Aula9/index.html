<body>
    <main>

        <section>

            <form onsubmit="cadastrar(event)">
                <label for="nome">Nome</label>
                <input id="nome" type="text" required>

                <label for="idade">Idade</label>
                <input id="idade" type="number" required>

                <label for="curso">Curso</label>
                <input type="text" id="curso" required>

                <label for="nota">Nota</label>
                <input type="number" min="0" max="10" id="nota" required>

                <button type="submit">Cadastrar</button>
            </form>

            <button onclick="exibir(event)">Show</button>
            <button onclick="fechar(event)">Unshow</button>

            <table id="table1">
                
            </table>

        </section>
    
    </main>

    <footer>
        <!-- Aqui será renderizado o 'footer.js' -->
    </footer>
</body>
