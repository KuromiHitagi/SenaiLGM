<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="../Aulas/css/footerStyle.css">

    <title>Aula 9</title>
</head>

<body>
    <main>

        <section>

            <form onsubmit="cadastrar(event)">

                <label for="nome">Nome</label>
                <input id="nome" type="text" size="50" required>

                <label for="curso">Curso</label>
                <input type="text" id="curso" size="50" required>

                <div class="notas">

                    <div>
                        <label for="nota1">Nota 1</label>
                        <input type="number" min="0" max="10" id="nota1" required>
                    </div>

                    <div>
                        <label for="nota2">Nota 2</label>
                        <input type="number" min="0" max="10" id="nota2" required>
                    </div>
                    
                    <div>
                        <label for="nota3">Nota 3</label>
                        <input type="number" min="0" max="10" id="nota3" required>
                    </div>

                </div>

                <button type="submit">Cadastrar</button>
                

            </form>

            <div class="btns">
                <button onclick="limpar(event)">Limpar</button>
                <button onclick="exibir(event)">Show</button>
                <button onclick="fechar(event)">Unshow</button>
            </div>

            <table id="table1">

            </table>

        </section>

    </main>

    <footer>
        <!-- Aqui será renderizado o 'footer.js' -->
    </footer>
</body>
<script src="./script.js"></script>
<script src="../Aulas/footer.js"></script>
