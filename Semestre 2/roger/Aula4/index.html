<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Abubleble</title>

    <script>
        var nome = prompt("Digite seu nome: ")
        var exibir = function(nome) {
            document.write("Olá, " + nome + "! Seja bem-vindo(a) ao meu site.");
        }
        exibir(nome);
    </script>

    <script>
        function exibirArtigo(id, callbackSucesso, callbackErro) {
            if(true) {
                callbackSucesso('Funções de callback em JS', 'Funções de callback são muito utlizadas....');  
            } else {
                callbackErro('Erro ao recuperar os dados.');
            }
        }

        var callbackSucesso = function(titulo, descricao) {
            document.write('<h1>' + titulo + '</h1>');
            document.write('<hr />')
            document.write('<p>' + descricao + '</p>');
        }

        var callbackErro = function(erro) {
            document.write('<h1><b>Erro:</b>' + erro + '</h1>');
        }

        exibirArtigo(1, callbackSucesso, callbackErro);
    </script>

    <script>
        function exibirArtigo(id, callbackSucesso, callbackErro) {
            if(id) {

    <script>
        document.write('Jorge Sant Ana'.length)
        document.write('Jorge Sant Ana'.charAt(7))

        var nome = 'Jorge Sant Ana'
        document.write(nome.indexOf('g'))
        document.write(nome.replace('Sant Ana', 'Silva'))

        document.write(nome.toLocaleLowerCase())
