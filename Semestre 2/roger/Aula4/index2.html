<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ablublele</title>

    <style>
        /* Configuração do HTML e Body */
        html,
        body {
            width: 100vw;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: #fff;
        }

        /* Container principal */
        main {
            width: 100%;
            height: 100vh;

            text-align: center;
        }

        .Caixa{
            margin: auto;
            width: 50%;
            height: 400px;

            border: 2px solid rgb(80, 52, 0);
            background-color: rgb(195, 0, 255);

            .Circulo{
                margin: 20px auto;

                width: 125px;
                height: 125px;

                border-radius: 50%;
                background-color: #fff
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Jojo</h1>

        <div class="Caixa">
            <div class="Circulo">

            </div>
        </div>
    </main>
</body>

</html>
