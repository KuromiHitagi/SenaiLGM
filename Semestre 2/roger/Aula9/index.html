<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 9</title>
</head>

<body>
    <main>
        <div id="minhaDiv">
            <h3>Hello</h3>
        </div>

        <button onclick="after()">After</button>
        <button onclick="append()">Append</button>
        <button onclick="before()">Before</button>
    </main>
</body>
<script>
    function after() {
        const div = document.getElementById('minhaDiv')
        div.after("World!")
        // document.getElementById('minhaDiv').after("World!")
    }

    function append() {
        const div = document.getElementById('minhaDiv')
        const h3 = document.createElement('h3')
        div.append(h3)
        h3.append("Hello! Este é o append no h3")
    }

    function before() {
        const div = document.getElementById('minhaDiv')
        div.before("Uhh?!")
        // document.getElementById('minhaDiv').before("World!")
    }
</script>

</html>
