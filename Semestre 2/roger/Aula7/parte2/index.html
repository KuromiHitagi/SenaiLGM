<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 7</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all ease 0.3s;
        }

        html,
        body {
            height: 100vh;
            width: 100vw;

            background-color: #303030;
        }

        main {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;

            width: 100%;
            height: 100%;

            .Container {
                width: 80%;
                height: 80%;

                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-direction: column;

                background-color: #262626;

                border: 2px solid #202020;
                border-radius: 15px;

                .Header {
                    width: 100%;
                    height: 10%;

                    display: flex;
                    align-items: center;
                    justify-content: center;

                    color: #ffc9ff;

                    border-bottom: 2px solid #404040;
                }

                .Content {
                    flex: 1;
                    width: 100%;
                    height: 100%;

                    display: flex;
                    justify-content: center;
                    align-items: center;

                    .Afazeres {
                        flex: 1;

                        width: 100%;
                        height: 80%;

                        display: flex;
                        align-content: center;
                        justify-content: start;
                        flex-direction: column;

                        padding: 2% 5%;

                        ol {
                            width: 90%;
                            max-height: 100%;
                            overflow-y: auto;
                            padding-right: 10px;

                            li {
                                margin: 2% 0;
                                padding: 0 2%;
                                color: #fdd2fd;
                                background-color: #404040;

                                border: 2px solid #202020;
                                border-radius: 15px;

                                font-size: 32px;
                            }
                        }
                    }

                    .Btns {
                        width: 25%;
                        height: 100%;

                        display: flex;
                        align-items: center;
                        justify-content: center;
                        flex-direction: column;
                        gap: 100px;

                        border-left: 2px solid #404040;

                        button {
                            width: 70%;
                            height: 10%;

                            font-size: 24px;
                            color: #ffc9ff;
                            background-color: #404040;

                            border: 2px solid #202020;
                            border-radius: 15px;

                            &:hover {
                                transform: scale(1.2);
                            }
                        }
                    }
                }
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="Container">
            <div class="Header">
                <h1>Lista de Tarefas</h1>
            </div>

            <div class="Content">
                <div class="Afazeres">
                    <ol id="afazeres"></ol>
                </div>

                <div class="Btns">
                    <button onclick="listar()">Listar Tarefas</button>
                    <button onclick="inserir()">Inserir Tarefa</button>
                    <button onclick="editar()">Editar Tarefa</button>
                    <button onclick="excluir()">Excluir Tarefa</button>
                </div>
            </div>
        </div>
    </main>
</body>
<script>
    let Tarefas = ["Matar Indiano Miguel"];

    function listar() {
        const afazeres = document.getElementById("afazeres")
        afazeres.innerHTML = ''

        Tarefas.forEach((e, index) => {
            afazeres.innerHTML += `
                <li>${index + 1} - ${e}</li>
            `
        })
    }
    listar()

    function inserir() {
        let nomeTarefa = String(prompt("Insira a Tarefa: "))
        Tarefas.push(nomeTarefa)
        alert("Tarefa adicionada com sucesso!")
        listar()
    }

    function editar() {
        let id = parseInt(prompt("Digite o ID da tarefa a ser editada: "))

        if(id > 0 && id <= Tarefas.length) {
            let textoAntigo = Tarefas[id - 1]
            let textoNovo = String(prompt(`Texto antigo: ${textoAntigo}. Digite o novo: `))

            Tarefas[id - 1] = textoNovo;
            alert("Tarefa geneticamente modificada com sucesso!")
            listar()
        } else{
            alert("Tarefa não encontrada!")
        }
    }

    function excluir() {
        let digitado = prompt("Digite o ID da tarefa a ser excluído: ")

        if (digitado == "@all") {
            Tarefas.length = 0

            alert("Brutality!")
            listar()
        } else {
            let id = parseInt(digitado)

            //TESTES
            // console.log("id: " + id)
            // console.log("Array: " + Tarefas)
            // console.log("length: " + Tarefas.length)
            // console.log("length + 1: " + (Tarefas.length + 1))

            if (id > 0 && id <= Tarefas.length) {
                Tarefas.splice((id - 1), 1)

                alert("Tarefa eliminada com sucesso!")
                listar()
            } else {
                alert("ERROR: Digite um número válido!")
            }
        }
    }
</script>

</html>
