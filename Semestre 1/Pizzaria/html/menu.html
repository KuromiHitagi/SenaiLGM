    <link rel="stylesheet" href="../css/menu.css">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap" rel="stylesheet" />

    <main>

        <section class="cards-tipos">

            <article class="card">
                <a class="grow" href="#swiper-pizza">
                    <div class="img-div">
                        <img src="https://cdn-icons-png.flaticon.com/128/1404/1404945.png" alt="pizza-icon">
                    </div>

                    <div class="content-div">
                        <p>Pizzas</p>
                    </div>
                </a>
            </article>

            <article class="card">

                    <div class="img-div">
                        <img src="https://cdn-icons-png.flaticon.com/128/536/536658.png" alt="soda-icon">
                    </div>

                    <div class="content-div">
                        <p>Bebidas</p>
                    </div>
                </a>
            </article>

        </section>

        <section class="swiper-Pizzas">
            <div class="swiper swiper-pizza-container">
                <div class="swiper-wrapper" id="swiper-pizza">
                    <!-- Aqui serão renderizadas as pizzas do arquivo 'JSON_Pizza.js', por um carrossel feito pela biblioteca swiper -->
                </div>

                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>
            </div>
        </section>

        <!-- <section class="swiper-Combo">
            <div class="swiper swiper-combo-container">

                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>
            </div>

        <section class="swiper-Soda">
            <div class="swiper swiper-soda-container">
                <div class="swiper-wrapper" id="swiper-soda">
                    <!-- Aqui serão renderizados os Refrigerantes do arquivo 'JSON_Soda.js', por um carrossel feito pela biblioteca swiper -->
                </div>

                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>
            </div>
        </section>

    </main>

    <div id="modal">
        <!-- Esta div serve apenas para expandir os detalhes das pizzas do arquivo 'JSON' -->
    </div>

    <footer id="footer">
        <!-- Aqui será renderizado o 'Footer.js' -->
    </footer>

</body>
<script src="../js/JSONS/JSON_Pizza.js"></script>
<script src="../js/JSONS/JSON_Soda.js"></script>

<script src="../js/body/header.js"></script>

<script src="../js/carrinho.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
    const swiperPizza = new Swiper('.swiper-pizza-container', {
        slidesPerView: 3,
        spaceBetween: 30,
        loop: true,
        navigation: {
            nextEl: '.swiper-pizza-container .swiper-button-next',
            prevEl: '.swiper-pizza-container .swiper-button-prev',
        },
        breakpoints: {
            320: { slidesPerView: 1 },
            768: { slidesPerView: 2 },
            1024: { slidesPerView: 3 }
        }
    });
